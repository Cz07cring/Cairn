[project]
name = "ring-evidence-ledger"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.40,<2",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_ledger"]
