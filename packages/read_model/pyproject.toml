[project]
name = "ring-read-model"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy>=2,<3",
    "ring-control-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_model"]

[tool.uv.sources]
ring-control-kernel = { workspace = true }
