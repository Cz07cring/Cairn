[project]
name = "ring-control-kernel"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.3.5,<4",
    "ring-evidence-ledger",
    "ring-context-compiler",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_kernel"]

[tool.uv.sources]
ring-evidence-ledger = { workspace = true }
ring-context-compiler = { workspace = true }
