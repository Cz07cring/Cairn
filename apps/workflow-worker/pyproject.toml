[project]
name = "ring-workflow-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ring-orchestration",
    "ring-control-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_worker"]

[tool.uv.sources]
ring-orchestration = { workspace = true }
ring-control-kernel = { workspace = true }
