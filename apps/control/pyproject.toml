[project]
name = "ring-control"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "PyJWT[crypto]>=2,<3", "ring-control-kernel", "ring-evidence-ledger", "ring-context-compiler", "ring-read-model", "ring-execution-broker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_api"]
