[project]
name = "ring-orchestration"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "temporalio==1.32.0",
    "ring-control-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]

[tool.uv.sources]
ring-control-kernel = { workspace = true }
