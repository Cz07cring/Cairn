# Disposable project-API database only; full application services are not yet implemented.
services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: ring
      POSTGRES_DB: ring_test
      POSTGRES_PASSWORD: ${RING_TEST_PG_PASSWORD:?provide an isolated test password}
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ring -d ring_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: ring-test
      MINIO_ROOT_PASSWORD: ${RING_TEST_S3_PASSWORD:?provide an isolated test password}
    ports:
      - "127.0.0.1::9000"
